      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <!-- Border grid -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#262626" stroke-width="2"/>
  <circle cx="40" cy="40" r="6" fill="#B5532F"/>
  <circle cx="1160" cy="40" r="6" fill="#B5532F"/>
  <circle cx="40" cy="590" r="6" fill="#B5532F"/>
  <circle cx="1160" cy="590" r="6" fill="#B5532F"/>

  <!-- Brand badge -->
  <g transform="translate(80, 80)">
    <rect width="70" height="70" rx="4" fill="#0A0A0A" stroke="#B5532F" stroke-width="2"/>
    <text x="35" y="48" font-family="'Arial Black', sans-serif" font-weight="900" font-size="36" fill="#B5532F" text-anchor="middle">TT</text>
  </g>

  <!-- Tagline -->
  <text x="170" y="115" font-family="'Courier New', monospace" font-size="16" fill="#B5532F" letter-spacing="4">TAMIL NADU • 1-OF-1 VINTAGE DROPS</text>
  <text x="170" y="138" font-family="'Courier New', monospace" font-size="14" fill="#8E8B85" letter-spacing="2">AUTHENTIC PRE-LOVED STREETWEAR</text>

